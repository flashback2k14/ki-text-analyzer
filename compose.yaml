services:
  app:
    build: .
    image: ki-text-analyzer
    container_name: ki-text-analyzer
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    # Werte kommen aus .env (lokal) oder aus den Stack-Umgebungsvariablen (Portainer); keine .env-Datei nötig.
    environment:
      NODE_ENV: production
      APP_SECRET: "${APP_SECRET:?APP_SECRET fehlt. Erzeugen mit openssl rand -base64 32}"
      REGISTRATION_CODE: ${REGISTRATION_CODE:-}
      SESSION_COOKIE_INSECURE: ${SESSION_COOKIE_INSECURE:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      USD_EUR_RATE: ${USD_EUR_RATE:-}
    volumes:
      - app-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  app-data: {}
